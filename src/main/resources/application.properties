spring.application.name=career-coach-ai

spring.ai.model.chat=openai
spring.ai.model.embedding=none

spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.chat.options.model=openai/gpt-oss-120b

spring.ai.openai.timeout=30s
spring.ai.openai.max-retries=0
spring.ai.retry.max-attempts=1
spring.ai.openai.chat.replay-reasoning-content=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
#GROQ_API_KEY=${GROQ_API_KEY}